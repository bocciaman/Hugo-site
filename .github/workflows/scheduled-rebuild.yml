name: Weekly Rebuild

on:
  schedule:
    # Every Monday at 10:00 AM UTC (6:00 AM Eastern)
    - cron: "0 10 * * 1"
  workflow_dispatch: # also allows manual trigger from GitHub Actions tab

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify deploy
        run: |
          curl -s -X POST "${{ secrets.NETLIFY_BUILD_HOOK_URL }}"
